[package]
name = "extrawork"
version = "0.1.0"
edition = "2021"
description = "Repair one returned extra-work request and show the record."
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "extrawork"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
csv = "1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
futures = "0.3"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
